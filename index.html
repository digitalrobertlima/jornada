<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jornada — Resgate Financeiro & Soberania</title>
  <meta name="description" content="App local-first para sair das dívidas: triagem tática, horas de vida resgatadas e caminho até a soberania em Bitcoin. Seus dados nunca saem do aparelho.">
  <meta name="theme-color" content="#0F1115">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Jornada">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="referrer" content="no-referrer">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="./assets/icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/app.css">
  <link rel="modulepreload" href="./js/app.js">
</head>
<body class="hide-nav">
  <header class="app-header">
    <div class="brand" aria-label="Jornada">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#161920"/><path d="M13 47 L25 39" stroke="#FF007F" stroke-width="5" stroke-linecap="round"/><path d="M25 39 L34 43 L50 18" fill="none" stroke="#00BFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="50" cy="18" r="5.5" fill="#00BFFF"/></svg>
      <span>JORNADA</span>
    </div>
    <span class="era-chip" id="era-chip" hidden></span>
    <div class="header-spacer"></div>
    <div class="profile-switch" id="profile-switch" role="group" aria-label="Perfis"></div>
    <button class="icon-btn" id="btn-settings" type="button" aria-label="Ajustes e dados" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <main id="view" tabindex="-1">
    <div class="empty" id="boot-msg">Abrindo o cofre local…</div>
    <noscript><div class="alert">O Jornada precisa de JavaScript ligado para funcionar.</div></noscript>
  </main>

  <nav class="bottom-nav" aria-label="Navegação principal">
    <button type="button" data-tab="hud" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg>
      HUD Tático
    </button>
    <button type="button" data-tab="wallet">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 16c2.5 0 2.5-3 5-3s2.5 3 5 3 2.5-3 5-3 2.5 3 5 3"/><rect x="4" y="3" width="16" height="7" rx="2"/></svg>
      Carteira & Onda
    </button>
    <button type="button" data-tab="battle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V11l3-2v12M10 21V6l4-3v18M16 21v-8l3-2v10"/><path d="M3 21h18"/></svg>
      Campo de Batalha
      <span class="badge" id="badge-front" hidden></span>
    </button>
    <button type="button" data-tab="vault">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="12" cy="12" r="3.5"/><path d="M12 8.5V7M12 17v-1.5M15.5 12H17M7 12h1.5"/></svg>
      Cofre Soberano
    </button>
  </nav>

  <div class="toast-zone" id="toasts" aria-live="polite"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
